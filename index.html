<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soros - Krishoker Fresh Ponno</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #4caf50;
            --accent-yellow: #ffb300;
            --bg-color: #f4f9f4;
            --text-dark: #333333;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header & Navbar */
        header {
            background: var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--primary-green);
        }

        .logo-area h1 {
            font-size: 24px;
            color: var(--primary-green);
            font-weight: 700;
        }

        .cart-btn {
            background: var(--primary-green);
            color: var(--white);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background: var(--light-green);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(46, 125, 50, 0.8), rgba(46, 125, 50, 0.8)), url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: var(--white);
            text-align: center;
            padding: 60px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-green);
            font-size: 28px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-price {
            color: var(--primary-green);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .add-to-cart {
            background: var(--accent-yellow);
            border: none;
            color: var(--text-dark);
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
        }

        .add-to-cart:hover {
            background: #ffa000;
        }

        /* Product Details View */
        .details-view {
            display: none;
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 20px;
        }

        .back-btn {
            background: #666;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .details-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media(max-width: 768px) {
            .details-content {
                grid-template-columns: 1fr;
            }
        }

        .details-img-container img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .thumbnail-images {
            display: flex;
            gap: 10px;
        }

        .thumbnail-images img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumbnail-images img:hover, .thumbnail-images img.active {
            border-color: var(--primary-green);
        }

        .details-info h2 {
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .details-price {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-green);
            margin-bottom: 15px;
        }

        .details-desc {
            margin-bottom: 20px;
            color: #555;
        }

        /* Cart Drawer */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: var(--white);
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 2000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-header {
            background: var(--primary-green);
            color: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--white);
            font-size: 20px;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .cart-footer {
            padding: 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .checkout-btn {
            background: var(--primary-green);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Checkout Modal */
        .checkout-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .checkout-box {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }

        .checkout-box h3 {
            margin-bottom: 15px;
            color: var(--primary-green);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        footer {
            background: #1b4d1e;
            color: var(--white);
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="navbar">
            <div class="logo-area" onclick="goHome()">
                <img src="logo.jpeg" alt="Soros Logo" class="brand-logo">
                <h1>Soros</h1>
            </div>
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping"></i> Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="hero-section">
        <h2>Krishoker Fresh Ponno</h2>
        <p>Sorasori khamar theke songrihito khanti dudh, dim, ghee ebong khati khabar.</p>
    </section>

    <!-- Main Container -->
    <div class="container">
        <!-- Products Home Grid -->
        <div id="home-view">
            <h2 class="section-title">Amader Ponnosuho</h2>
            <div class="product-grid" id="product-grid"></div>
        </div>

        <!-- Product Details View -->
        <div class="details-view" id="details-view">
            <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Back to Products</button>
            <div class="details-content">
                <div class="details-img-container">
                    <img id="main-detail-img" src="" alt="">
                    <div class="thumbnail-images" id="thumbnail-container"></div>
                </div>
                <div class="details-info">
                    <h2 id="detail-title"></h2>
                    <div class="details-price" id="detail-price"></div>
                    <p class="details-desc" id="detail-desc"></p>
                    <button class="add-to-cart" id="detail-add-btn" style="padding: 12px; font-size: 16px;">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3>Shopping Cart</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <p>Cart is empty.</p>
        </div>
        <div class="cart-footer">
            <h4>Total: ৳ <span id="cart-total">0</span></h4>
            <button class="checkout-btn" onclick="openCheckout()">Confirm Order</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="checkout-modal" id="checkoutModal">
        <div class="checkout-box">
            <h3>Shipping & Contact Info</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="customer-name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="customer-phone" placeholder="Enter phone number">
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="customer-address" placeholder="Enter full address"></textarea>
            </div>
            <button class="checkout-btn" onclick="submitOrder()">Send Order via WhatsApp</button>
            <button class="checkout-btn" style="background: #d32f2f; margin-top: 5px;" onclick="closeCheckout()">Cancel</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Soros - All rights reserved</p>
    </footer>

    <!-- JavaScript -->
    <script>
        const products = [
            { 
                id: 1, 
                name: "Brown Sugar (ব্রাউন সুগার)", 
                price: 150, 
                img: "01.jpg", 
                gallery: ["01.jpg", "logo.jpeg"], 
                desc: "100% khati ebong roshonnirobhor brown sugar, ja khabarer swad bariye tole ebong shasthyer jonno khub-e upokari." 
            },
            { 
                id: 2, 
                name: "Khanti Gorur Dudh (গরুর দুধ)", 
                price: 120, 
                img: "004.jpg", 
                gallery: ["004.jpg", "logo.jpeg"], 
                desc: "Khamar theke sora-suri songrihito khanti ebong khalis gorur dudh." 
            },
            { 
                id: 3, 
                name: "Deshi Murgir Dim (দেশি মুরগির ডিম)", 
                price: 70, 
                img: "02.png", 
                gallery: ["02.png", "logo.jpeg"], 
                desc: "Deshi murgir khati pushtikor dim, protidin-er niramish ba amrish aharer jonno perfect." 
            },
            { 
                id: 4, 
                name: "Deshi Murgi (দেশি মুরগি)", 
                price: 650, 
                img: "03.jpeg", 
                gallery: ["03.jpeg", "logo.jpeg"], 
                desc: "Khate palon kora shasthosommot deshi murgi." 
            }
        ];

        let cart = [];

        function loadProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="product-card" onclick="showProductDetails(${product.id})">
                    <img src="${product.img}" alt="${product.name}" class="product-img">
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">৳ ${product.price}</div>
                        <button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${product.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function showProductDetails(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('hero-section').style.display = 'none';
            document.getElementById('details-view').style.display = 'block';

            document.getElementById('detail-title').innerText = product.name;
            document.getElementById('detail-price').innerText = `৳ ${product.price}`;
            document.getElementById('detail-desc').innerText = product.desc;
            
            const mainImg = document.getElementById('main-detail-img');
            mainImg.src = product.img;

            const thumbContainer = document.getElementById('thumbnail-container');
            thumbContainer.innerHTML = product.gallery.map((imgSrc, idx) => `
                <img src="${imgSrc}" class="${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${imgSrc}', this)">
            `).join('');

            document.getElementById('detail-add-btn').onclick = function() {
                addToCart(product.id);
            };

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeMainImage(src, element) {
            document.getElementById('main-detail-img').src = src;
            document.querySelectorAll('.thumbnail-images img').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
        }

        function goHome() {
            document.getElementById('details-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('hero-section').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('open');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            
            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const cartCount = document.getElementById('cart-count');
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');

            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p>Cart is empty.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <h4>${item.name}</h4>
                            <p>৳ ${item.price} x ${item.quantity}</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:red; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            }

            cart.forEach(item => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;
            });

            cartCount.innerText = totalCount;
            cartTotal.innerText = totalPrice;
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        function openCheckout() {
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function submitOrder() {
            const name = document.getElementById('customer-name').value;
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;

            if (!name || !phone || !address) {
                alert('Doya kore shob tottho puron korun.');
                return;
            }

            let orderDetails = `Notun Order - Soros%0A`;
            orderDetails += `Nam: ${name}%0APhone: ${phone}%0AThikana: ${address}%0A%0APonner Talika:%0A`;
            
            let total = 0;
            cart.forEach(item => {
                orderDetails += `- ${item.name} (${item.quantity}ti) - ৳ ${item.price * item.quantity}%0A`;
                total += item.price * item.quantity;
            });
            orderDetails += `%0AMot Mulsho: ৳ ${total}`;

            const whatsappNumber = "8801336530525"; 
            window.open(`https://wa.me/${whatsappNumber}?text=${orderDetails}`, '_blank');
        }

        // Initialize App
        loadProducts();
    </script>
</body>
</html>
