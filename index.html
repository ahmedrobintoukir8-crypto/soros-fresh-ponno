<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soros - Krishoker Fresh Ponno</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #4caf50;
            --accent-yellow: #ffb300;
            --bg-color: #f4f9f4;
            --text-dark: #333333;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header & Navbar */
        header {
            background: var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--primary-green);
        }

        .logo-area h1 {
            font-size: 24px;
            color: var(--primary-green);
            font-weight: 700;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-btn {
            background: var(--bg-color);
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            padding: 7px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .lang-btn:hover {
            background: var(--primary-green);
            color: var(--white);
        }

        .cart-btn {
            background: var(--primary-green);
            color: var(--white);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background: var(--light-green);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(46, 125, 50, 0.8), rgba(46, 125, 50, 0.8)), url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: var(--white);
            text-align: center;
            padding: 60px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary-green);
            font-size: 28px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-price {
            color: var(--primary-green);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .add-to-cart {
            background: var(--accent-yellow);
            border: none;
            color: var(--text-dark);
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
        }

        .add-to-cart:hover {
            background: #ffa000;
        }

        /* Product Details View */
        .details-view {
            display: none;
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 20px;
        }

        .back-btn {
            background: #666;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .details-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media(max-width: 768px) {
            .details-content {
                grid-template-columns: 1fr;
            }
        }

        .details-img-container img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .thumbnail-images {
            display: flex;
            gap: 10px;
        }

        .thumbnail-images img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumbnail-images img:hover, .thumbnail-images img.active {
            border-color: var(--primary-green);
        }

        .details-info h2 {
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .details-price {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-green);
            margin-bottom: 15px;
        }

        .details-desc {
            margin-bottom: 20px;
            color: #555;
        }

        /* Cart Drawer */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: var(--white);
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            z-index: 2000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-header {
            background: var(--primary-green);
            color: var(--white);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--white);
            font-size: 20px;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .cart-footer {
            padding: 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .checkout-btn {
            background: var(--primary-green);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Checkout Modal */
        .checkout-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .checkout-box {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
        }

        .checkout-box h3 {
            margin-bottom: 15px;
            color: var(--primary-green);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        footer {
            background: #1b4d1e;
            color: var(--white);
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="navbar">
            <div class="logo-area" onclick="goHome()">
                <img src="logo.jpeg" alt="Soros Logo" class="brand-logo">
                <h1>সরস</h1>
            </div>
            <div class="nav-right">
                <button class="lang-btn" id="lang-toggle-btn" onclick="toggleLanguage()">English</button>
                <button class="cart-btn" onclick="toggleCart()">
                    <i class="fa-solid fa-cart-shopping"></i> <span data-translate="cart">কার্ট</span> (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="hero-section">
        <h2 data-translate="hero-title">কৃষকের ফ্রেশ পণ্য</h2>
        <p data-translate="hero-desc">সরাসরি খামার থেকে সংগৃহীত ব্রাউন সুগার, খাঁটি দুধ, ডিম ও দেশি মুরগি।</p>
    </section>

    <!-- Main Container -->
    <div class="container">
        <!-- Products Home Grid -->
        <div id="home-view">
            <h2 class="section-title" data-translate="sec-title">আমাদের পণ্যসমূহ</h2>
            <div class="product-grid" id="product-grid"></div>
        </div>

        <!-- Product Details View -->
        <div class="details-view" id="details-view">
            <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> <span data-translate="back-btn">ফিরে যান</span></button>
            <div class="details-content">
                <div class="details-img-container">
                    <img id="main-detail-img" src="" alt="">
                    <div class="thumbnail-images" id="thumbnail-container"></div>
                </div>
                <div class="details-info">
                    <h2 id="detail-title"></h2>
                    <div class="details-price" id="detail-price"></div>
                    <p class="details-desc" id="detail-desc"></p>
                    <button class="add-to-cart" id="detail-add-btn" style="padding: 12px; font-size: 16px;" data-translate="add-to-cart">কার্টে যোগ করুন</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3 data-translate="cart-title">আপনার শপিং কার্ট</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <p data-translate="empty-cart">আপনার কার্ট খালি রয়েছে।</p>
        </div>
        <div class="cart-footer">
            <h4><span data-translate="total">মোট</span>: ৳ <span id="cart-total">0</span></h4>
            <button class="checkout-btn" onclick="openCheckout()" data-translate="checkout">অর্ডার কনফার্ম করুন</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="checkout-modal" id="checkoutModal">
        <div class="checkout-box">
            <h3 data-translate="shipping-title">শিপিং ও যোগাযোগের তথ্য</h3>
            <div class="form-group">
                <label data-translate="name-label">আপনার নাম</label>
                <input type="text" id="customer-name" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label data-translate="phone-label">মোবাইল নম্বর</label>
                <input type="text" id="customer-phone" placeholder="আপনার ফোন নম্বর">
            </div>
            <div class="form-group">
                <label data-translate="address-label">ঠিকানা</label>
                <textarea id="customer-address" placeholder="পূর্ণ ঠিকানা লিখুন"></textarea>
            </div>
            <button class="checkout-btn" onclick="submitOrder()" data-translate="whatsapp-btn">WhatsApp-এ অর্ডার পাঠান</button>
            <button class="checkout-btn" style="background: #d32f2f; margin-top: 5px;" onclick="closeCheckout()" data-translate="cancel-btn">বাতিল</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p data-translate="footer-text">&copy; ২০২৬ সরস - সর্বস্বত্ব সংরক্ষিত | কৃষকের ফ্রেশ পণ্য</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let currentLang = 'bn'; // Default language is Bengali

        const translations = {
            bn: {
                cart: "কার্ট",
                "hero-title": "কৃষকের ফ্রেশ পণ্য",
                "hero-desc": "সরাসরি খামার থেকে সংগৃহীত ব্রাউন সুগার, খাঁটি দুধ, ডিম ও দেশি মুরগি।",
                "sec-title": "আমাদের পণ্যসমূহ",
                "back-btn": "ফিরে যান",
                "add-to-cart": "কার্টে যোগ করুন",
                "cart-title": "আপনার শপিং কার্ট",
                "empty-cart": "আপনার কার্ট খালি রয়েছে।",
                total: "মোট",
                checkout: "অর্ডার কনফার্ম করুন",
                "shipping-title": "শিপিং ও যোগাযোগের তথ্য",
                "name-label": "আপনার নাম",
                "phone-label": "মোবাইল নম্বর",
                "address-label": "ঠিকানা",
                "whatsapp-btn": "WhatsApp-এ অর্ডার পাঠান",
                "cancel-btn": "বাতিল",
                "footer-text": "&copy; ২০২৬ সরস - সর্বস্বত্ব সংরক্ষিত | কৃষকের ফ্রেশ পণ্য"
            },
            en: {
                cart: "Cart",
                "hero-title": "Farmer's Fresh Products",
                "hero-desc": "Directly sourced brown sugar, pure milk, eggs, and local chicken from the farm.",
                "sec-title": "Our Products",
                "back-btn": "Back to Products",
                "add-to-cart": "Add to Cart",
                "cart-title": "Your Shopping Cart",
                "empty-cart": "Cart is empty.",
                total: "Total",
                checkout: "Confirm Order",
                "shipping-title": "Shipping & Contact Info",
                "name-label": "Your Name",
                "phone-label": "Phone Number",
                "address-label": "Address",
                "whatsapp-btn": "Send Order via WhatsApp",
                "cancel-btn": "Cancel",
                "footer-text": "&copy; 2026 Soros - All rights reserved"
            }
        };

        const products = [
            { 
                id: 1, 
                name: { bn: "ব্রাউন সুগার", en: "Brown Sugar" }, 
                price: 150, 
                img: "01.jpg", 
                gallery: ["01.jpg", "logo.jpeg"], 
                desc: { 
                    bn: "১০০% খাঁটি এবং পুষ্টিকর ব্রাউন সুগার, যা খাবারের স্বাদ বাড়িয়ে তোলে এবং স্বাস্থ্যের জন্য খুবই উপকারী।", 
                    en: "100% pure and nutritious brown sugar that enhances food taste and is very healthy." 
                } 
            },
            { 
                id: 2, 
                name: { bn: "খাঁটি গরুর দুধ", en: "Pure Cow Milk" }, 
                price: 120, 
                img: "004.jpg", 
                gallery: ["004.jpg", "logo.jpeg"], 
                desc: { 
                    bn: "খামার থেকে সরাসরি সংগৃহীত খাঁটি এবং খালিস গরুর দুধ।", 
                    en: "Pure and fresh cow milk sourced directly from the farm." 
                } 
            },
            { 
                id: 3, 
                name: { bn: "দেশি মুরগির ডিম", en: "Deshi Chicken Eggs" }, 
                price: 70, 
                img: "02.png", 
                gallery: ["02.png", "logo.jpeg"], 
                desc: { 
                    bn: "দেশি মুরগির খাঁটি পুষ্টিকর ডিম, প্রতিদিনের পুষ্টির চাহিদার জন্য পারফেক্ট।", 
                    en: "Authentic nutritious local chicken eggs, perfect for daily nutrition." 
                } 
            },
            { 
                id: 4, 
                name: { bn: "দেশি মুরগি", en: "Deshi Chicken" }, 
                price: 650, 
                img: "03.jpeg", 
                gallery: ["03.jpeg", "logo.jpeg"], 
                desc: { 
                    bn: "খামারে প্রাকৃতিকভাবে পালিত স্বাস্থ্যসম্মত দেশি মুরগি।", 
                    en: "Healthy naturally-raised local chicken from the farm." 
                } 
            }
        ];

        let cart = [];
        let activeProductId = null;

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            document.getElementById('lang-toggle-btn').innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
            
            // Translate static elements
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[currentLang][key]) {
                    el.innerHTML = translations[currentLang][key];
                }
            });

            // Reload products grid or active details page based on current view
            loadProducts();
            if (activeProductId !== null) {
                showProductDetails(activeProductId);
            }
            updateCart();
        }

        function loadProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="product-card" onclick="showProductDetails(${product.id})">
                    <img src="${product.img}" alt="${product.name[currentLang]}" class="product-img">
                    <div class="product-info">
                        <div class="product-title">${product.name[currentLang]}</div>
                        <div class="product-price">৳ ${product.price}</div>
                        <button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${product.id})">${translations[currentLang]['add-to-cart']}</button>
                    </div>
                </div>
            `).join('');
        }

        function showProductDetails(productId) {
            activeProductId = productId;
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('hero-section').style.display = 'none';
            document.getElementById('details-view').style.display = 'block';

            document.getElementById('detail-title').innerText = product.name[currentLang];
            document.getElementById('detail-price').innerText = `৳ ${product.price}`;
            document.getElementById('detail-desc').innerText = product.desc[currentLang];
            document.getElementById('detail-add-btn').innerText = translations[currentLang]['add-to-cart'];
            
            const mainImg = document.getElementById('main-detail-img');
            mainImg.src = product.img;

            const thumbContainer = document.getElementById('thumbnail-container');
            thumbContainer.innerHTML = product.gallery.map((imgSrc, idx) => `
                <img src="${imgSrc}" class="${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${imgSrc}', this)">
            `).join('');

            document.getElementById('detail-add-btn').onclick = function() {
                addToCart(product.id);
            };

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeMainImage(src, element) {
            document.getElementById('main-detail-img').src = src;
            document.querySelectorAll('.thumbnail-images img').forEach(img => img.classList.remove('active'));
            element.classList.add('active');
        }

        function goHome() {
            activeProductId = null;
            document.getElementById('details-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('hero-section').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('open');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            
            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const cartCount = document.getElementById('cart-count');
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');

            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p>${translations[currentLang]['empty-cart']}</p>`;
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <h4>${item.name[currentLang]}</h4>
                            <p>৳ ${item.price} x ${item.quantity}</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:red; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            }

            cart.forEach(item => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;
            });

            cartCount.innerText = totalCount;
            cartTotal.innerText = totalPrice;
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        function openCheckout() {
            if (cart.length === 0) {
                alert(currentLang === 'bn' ? 'আপনার কার্ট খালি!' : 'Cart is empty!');
                return;
            }
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function submitOrder() {
            const name = document.getElementById('customer-name').value;
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;

            if (!name || !phone || !address) {
                alert(currentLang === 'bn' ? 'দয়া করে সব তথ্য পূরণ করুন।' : 'Please fill in all information.');
                return;
            }

            let orderDetails = currentLang === 'bn' ? `নতুন অর্ডার - সরস%0A` : `New Order - Soros%0A`;
            orderDetails += currentLang === 'bn' ? `নাম: ${name}%0Aফোন: ${phone}%0Aঠিকানা: ${address}%0A%0Aপণ্যের তালিকা:%0A` : `Name: ${name}%0APhone: ${phone}%0AAddress: ${address}%0A%0AProducts:%0A`;
            
            let total = 0;
            cart.forEach(item => {
                orderDetails += `- ${item.name[currentLang]} (${item.quantity}ti) - ৳ ${item.price * item.quantity}%0A`;
                total += item.price * item.quantity;
            });
            orderDetails += currentLang === 'bn' ? `%0 মোট মূল্য: ৳ ${total}` : `%0ATotal: ৳ ${total}`;

            const whatsappNumber = "8801336530525"; 
            window.open(`https://wa.me/${whatsappNumber}?text=${orderDetails}`, '_blank');
        }

        // Initialize App
        loadProducts();
    </script>
</body>
</html>
